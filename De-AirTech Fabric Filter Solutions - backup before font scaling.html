<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>De-AirTech · Fabric Filter Solutions</title>
<link href="assets/fonts/fonts.css" rel="stylesheet" />
<style>
/* ============ RESET & TOKENS ============ */
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#1a1d21; --bg-deep:#101317; --bg-soft:#21262d;
  --panel:rgba(255,255,255,.035); --panel-2:rgba(255,255,255,.05);
  --gold:#c8a265; --gold-lt:#e2c48d; --gold-dk:#a07d44;
  --ink:#e8eaed; --ink-soft:#c2cad1; --muted:#8e99a4; --slate:#4a5c6a;
  --line:rgba(200,162,101,.22); --line-soft:rgba(255,255,255,.08);
  --good:#7fb98a;
  --font:"Sora",system-ui,"Segoe UI","PingFang SC","Microsoft YaHei","Microsoft YaHei UI",sans-serif;
  --cjk:"PingFang SC","Microsoft YaHei","Microsoft YaHei UI",sans-serif;
  --ease:cubic-bezier(.22,.61,.36,1);
}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);
  overflow:hidden;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}

/* ============ DECK / STAGE (scale-to-fit, any ratio) ============ */
#deck{position:fixed;inset:0;background:var(--bg);overflow:hidden}
#stage{position:absolute;top:50%;left:50%;width:1920px;height:1080px;
  transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center center}

/* ambient background, fills whole viewport (outside stage) */
#fxwrap{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#fxwrap .glow{position:absolute;border-radius:50%;filter:blur(80px);opacity:.5}
#fxwrap .g1{width:48vw;height:48vw;top:-16vw;right:-10vw;
  background:radial-gradient(circle,rgba(200,162,101,.20),transparent 65%)}
#fxwrap .g2{width:42vw;height:42vw;bottom:-18vw;left:-12vw;
  background:radial-gradient(circle,rgba(74,92,106,.30),transparent 65%)}
#fxwrap .vig{position:absolute;inset:0;
  background:radial-gradient(120% 90% at 50% 42%,transparent 50%,rgba(0,0,0,.55) 100%)}
#fx{position:fixed;inset:0;z-index:1;pointer-events:none}

/* ============ SLIDE BASE ============ */
.slide{position:absolute;inset:0;display:none;flex-direction:column;
  padding:84px 116px 92px;background:var(--bg);overflow:hidden;z-index:2}
.slide.active{display:flex}
.slide::before{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(130% 80% at 88% 8%,rgba(200,162,101,.07),transparent 55%)}
.slide>*{position:relative;z-index:1}

/* slide header */
.s-head{margin-bottom:30px;flex:0 0 auto}
.kicker{font-size:18px;font-weight:600;letter-spacing:.34em;text-transform:uppercase;
  color:var(--gold);display:flex;align-items:center;gap:14px}
.kicker::before{content:"";width:42px;height:2px;background:linear-gradient(90deg,var(--gold),transparent)}
.s-title{font-size:56px;font-weight:600;line-height:1.06;margin-top:14px;color:var(--ink);letter-spacing:-.01em}
.s-title .hl{color:var(--gold)}
.s-rule{width:64px;height:3px;margin-top:18px;border-radius:3px;
  background:linear-gradient(90deg,var(--gold),var(--gold-dk))}

/* layout columns */
.body{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;justify-content:center}
.cols{display:grid;gap:54px;align-items:start}
.cols.r6040{grid-template-columns:1.18fr .82fr}
.cols.r5050{grid-template-columns:1fr 1fr}
.cols.r5545{grid-template-columns:1.1fr .9fr}
.col{display:flex;flex-direction:column;gap:22px;min-width:0}
.rows{display:flex;flex-direction:column;gap:22px}

/* ============ BLOCKS ============ */
.lead .lh{font-size:23px;font-weight:600;color:var(--gold-lt);margin-bottom:10px;
  display:flex;align-items:center;gap:10px}
.lead .lh::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--gold);
  box-shadow:0 0 0 4px rgba(200,162,101,.14)}
.lead p{font-size:18.5px;line-height:1.6;color:var(--ink-soft);margin-top:7px;max-width:60ch}
.lead p+p{margin-top:10px}

/* stats */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.stats.c4{grid-template-columns:repeat(4,1fr)}
.stats.c3{grid-template-columns:repeat(3,1fr)}
.stat{background:var(--panel);border:1px solid var(--line-soft);border-radius:14px;
  padding:22px 20px;position:relative;overflow:hidden}
.stat::after{content:"";position:absolute;left:0;top:0;width:3px;height:100%;
  background:linear-gradient(180deg,var(--gold),transparent)}
.stat .v{font-size:52px;font-weight:700;color:var(--gold);line-height:1;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums}
.stat .v .u{font-size:.5em;font-weight:500;color:var(--gold-lt);margin-left:2px}
.stat .l{font-size:16px;color:var(--ink-soft);margin-top:10px;line-height:1.35;letter-spacing:.01em}
.stats.sm .stat{padding:16px 16px}
.stats.sm .v{font-size:40px}

/* cards */
.cards{display:grid;gap:16px}
.cards.c2{grid-template-columns:1fr 1fr}
.cards.c3{grid-template-columns:repeat(3,1fr)}
.card{background:var(--panel);border:1px solid var(--line-soft);border-radius:14px;
  padding:20px 22px;transition:border-color .3s,transform .3s;min-width:0}
.card .ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;margin-bottom:12px;
  background:rgba(200,162,101,.12);border:1px solid var(--line);color:var(--gold)}
.card .ic svg{width:18px;height:18px}
.card .ch{font-size:20px;font-weight:600;color:var(--ink);margin-bottom:7px}
.card .ch .n{color:var(--gold);font-weight:700;margin-right:8px;font-variant-numeric:tabular-nums}
.card p{font-size:16px;line-height:1.5;color:var(--ink-soft)}
.card .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.card .tags span{font-size:14px;color:var(--ink-soft);background:rgba(255,255,255,.05);
  border:1px solid var(--line-soft);border-radius:20px;padding:4px 11px}

/* list */
.list{display:flex;flex-direction:column;gap:9px}
.list.lh-title{margin-top:2px}
.list .lt{font-size:20px;font-weight:600;color:var(--gold-lt);margin-bottom:4px}
.list li{list-style:none;font-size:17.5px;color:var(--ink-soft);line-height:1.42;
  padding-left:30px;position:relative}
.list li::before{content:"";position:absolute;left:0;top:7px;width:14px;height:8px;
  border-left:2px solid var(--gold);border-bottom:2px solid var(--gold);transform:rotate(-45deg)}

/* specs */
.specs{display:flex;flex-direction:column;gap:0;border-top:1px solid var(--line-soft)}
.spec{display:flex;justify-content:space-between;align-items:center;gap:16px;
  padding:13px 2px;border-bottom:1px solid var(--line-soft)}
.spec .k{font-size:17.5px;color:var(--muted)}
.spec .v{font-size:18px;color:var(--ink);font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.spec .v small{color:var(--gold-lt);font-weight:500}

/* steps (flow) */
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:0;position:relative}
.steps .line{position:absolute;top:29px;left:8%;right:8%;height:2px;
  background:linear-gradient(90deg,var(--gold-dk),var(--gold),var(--gold-dk));opacity:.4;transform-origin:left}
.step{padding:0 14px;text-align:center;position:relative}
.step .n{width:58px;height:58px;border-radius:50%;margin:0 auto 16px;display:grid;place-items:center;
  font-size:25px;font-weight:700;color:var(--bg);background:linear-gradient(150deg,var(--gold-lt),var(--gold-dk));
  box-shadow:0 8px 22px -6px rgba(200,162,101,.5);position:relative;z-index:1}
.step .st{font-size:18.5px;font-weight:600;color:var(--ink);margin-bottom:6px}
.step p{font-size:15.5px;line-height:1.45;color:var(--muted)}

/* note / callout */
.note{background:linear-gradient(135deg,rgba(200,162,101,.10),rgba(200,162,101,.02));
  border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:12px;padding:18px 20px}
.note .nh{font-size:18px;font-weight:600;color:var(--gold-lt);margin-bottom:6px}
.note p{font-size:16.5px;line-height:1.52;color:var(--ink-soft)}

/* badges */
.badges{display:flex;flex-wrap:wrap;gap:10px}
.badge{font-size:16px;font-weight:500;color:var(--ink-soft);background:var(--panel);
  border:1px solid var(--line);border-radius:30px;padding:9px 20px}
.badge.gold{color:var(--bg);background:linear-gradient(120deg,var(--gold-lt),var(--gold-dk));border:none;font-weight:600}

/* bars (distribution) */
.bars{display:flex;flex-direction:column;gap:15px}
.bar .bt{display:flex;justify-content:space-between;font-size:17px;margin-bottom:8px}
.bar .bt b{color:var(--ink)} .bar .bt span{color:var(--gold);font-weight:600;font-variant-numeric:tabular-nums}
.bar .track{height:8px;border-radius:8px;background:rgba(255,255,255,.06);overflow:hidden}
.bar .fill{height:100%;border-radius:8px;transform-origin:left;
  background:linear-gradient(90deg,var(--gold-dk),var(--gold-lt))}

/* figure */
.figs{display:grid;gap:14px;grid-template-columns:1fr}
.figs.c2{grid-template-columns:1fr 1fr}
.figs.c3{grid-template-columns:repeat(3,1fr)}
.figs.c4{grid-template-columns:repeat(4,1fr)}
.figure{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line);
  box-shadow:0 24px 50px -24px rgba(0,0,0,.8)}
.figure img{width:100%;height:100%;object-fit:cover;display:block}
.figure figcaption{position:absolute;left:0;right:0;bottom:0;padding:20px 16px 13px;font-size:15px;
  color:var(--ink-soft);background:linear-gradient(transparent,rgba(16,19,23,.94))}
.figure.contain{background:#eef0f2}
.figure.contain img{object-fit:contain;padding:6px}
.figure.diagram{background:#14171b}
.figure.diagram svg{width:100%;height:100%;display:block}

/* before / after */
.bafter{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px}
.bafter .figure{margin:0}
.bafter .baarrow{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto;
  color:var(--bg);background:linear-gradient(150deg,var(--gold-lt),var(--gold-dk));
  box-shadow:0 8px 20px -6px rgba(200,162,101,.55)}
.bafter .baarrow svg{width:20px;height:20px}
.batag{position:absolute;left:10px;bottom:10px;font-size:13px;font-weight:600;color:#fff;
  padding:4px 11px;border-radius:20px;backdrop-filter:blur(4px)}
.batag.old{background:rgba(74,92,106,.85)}
.batag.new{background:rgba(127,185,138,.9);color:#10241a}

/* ============ COVER ============ */
.cover{padding:0;justify-content:flex-end}
.cover .cbg{position:absolute;inset:0;z-index:0}
.cover .cbg img{width:100%;height:100%;object-fit:cover}
.cover .cbg::after{content:"";position:absolute;inset:0;
  background:linear-gradient(90deg,rgba(16,18,21,.96) 26%,rgba(16,18,21,.6) 55%,rgba(16,18,21,.25) 100%),
  linear-gradient(0deg,rgba(16,18,21,.9),transparent 60%)}
.cover .inner{position:relative;z-index:2;padding:0 116px 78px;max-width:1200px}
.cover .brandline{display:flex;align-items:center;gap:14px;margin-bottom:22px}
.cover .brandline img{height:42px}
.cover .brandline .bw{font-size:20px;font-weight:600;letter-spacing:.02em}
.cover .brandline .bw b{color:var(--gold)}
.cover .ckick{font-size:17px;letter-spacing:.4em;text-transform:uppercase;color:var(--gold);
  font-weight:600;margin-bottom:14px}
.cover h1{font-size:84px;font-weight:700;line-height:1;letter-spacing:-.02em}
.cover h1 .l2{color:var(--gold);display:block}
.cover .csub{font-size:21px;color:var(--ink-soft);margin-top:18px;max-width:40ch;line-height:1.5}
.cover .ctag{margin-top:22px;display:inline-flex;align-items:center;gap:12px;font-size:15px;
  letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.cover .ctag::before{content:"";width:30px;height:1px;background:var(--gold)}

/* ============ CHAPTER DIVIDER ============ */
.chapter{padding:0;justify-content:center}
.chapter .cbg{position:absolute;inset:0;z-index:0}
.chapter .cbg img{width:100%;height:100%;object-fit:cover;filter:saturate(.9)}
.chapter .cbg::after{content:"";position:absolute;inset:0;
  background:linear-gradient(105deg,rgba(16,18,21,.97) 30%,rgba(16,18,21,.7) 60%,rgba(16,18,21,.45))}
.chapter .inner{position:relative;z-index:2;padding:0 130px;display:flex;align-items:center;gap:60px}
.chapter .bignum{font-size:300px;font-weight:800;line-height:.8;color:transparent;
  -webkit-text-stroke:2px rgba(200,162,101,.55);letter-spacing:-.04em;
  background:linear-gradient(180deg,rgba(200,162,101,.18),transparent);-webkit-background-clip:text;background-clip:text}
.chapter .ctext .ck{font-size:18px;letter-spacing:.4em;text-transform:uppercase;color:var(--gold);font-weight:600}
.chapter .ctext h2{font-size:76px;font-weight:700;line-height:1.02;margin-top:16px;letter-spacing:-.02em}
.chapter .ctext .cs{font-size:23px;color:var(--ink-soft);margin-top:18px;max-width:34ch;line-height:1.5}
.chapter .ctext .crule{width:80px;height:3px;background:var(--gold);margin-top:26px;border-radius:3px}

/* ============ TOC ============ */
.toc .tgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px 46px;margin-top:6px}
.toc .titem{display:flex;gap:20px;align-items:flex-start;padding:16px 18px;border-radius:13px;
  border:1px solid transparent;transition:.3s;cursor:pointer}
.toc .titem:hover{border-color:var(--line);background:var(--panel)}
.toc .titem .tn{font-size:42px;font-weight:700;color:var(--gold);line-height:1;
  font-variant-numeric:tabular-nums;min-width:62px}
.toc .titem .tt b{font-size:23px;font-weight:600;color:var(--ink);display:block}
.toc .titem .tt span{font-size:16.5px;color:var(--muted);margin-top:4px;display:block;line-height:1.4}

/* ============ MAP ============ */
.map .mwrap{display:grid;grid-template-columns:1.5fr .9fr;gap:40px;align-items:center}
.map .frame{position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--line);
  background:#f3f4f6;box-shadow:0 30px 70px -28px rgba(0,0,0,.85)}
.map .frame img{width:100%;display:block}
.map .marker{position:absolute;width:14px;height:14px;border-radius:50%;background:var(--gold);
  transform:translate(-50%,-50%);box-shadow:0 0 0 0 rgba(200,162,101,.6)}
.map .mside{display:flex;flex-direction:column;gap:18px}

/* ============ PARTNERS ============ */
.pgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.plogo{background:#fff;border-radius:12px;height:90px;display:grid;place-items:center;padding:14px;
  box-shadow:0 14px 30px -16px rgba(0,0,0,.7)}
.plogo img{max-width:100%;max-height:100%;object-fit:contain}

/* ============ CONTACT ============ */
.contact{padding:0;justify-content:center;align-items:center;text-align:center}
.contact .cbg{position:absolute;inset:0;z-index:0}
.contact .cbg img{width:100%;height:100%;object-fit:cover}
.contact .cbg::after{content:"";position:absolute;inset:0;background:rgba(13,15,18,.82)}
.contact .inner{position:relative;z-index:2;max-width:1000px;padding:0 60px}
.contact .ck{font-size:18px;letter-spacing:.4em;text-transform:uppercase;color:var(--gold);font-weight:600}
.contact h2{font-size:74px;font-weight:700;margin-top:18px;line-height:1.05}
.contact .cmsg{font-size:22px;color:var(--ink-soft);margin-top:22px;line-height:1.55}
.contact .cinfo{display:flex;justify-content:center;gap:18px;margin-top:42px;flex-wrap:wrap}
.contact .ci{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px 28px;min-width:240px}
.contact .ci .cl{font-size:14px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-bottom:8px}
.contact .ci .cv{font-size:20px;color:var(--ink);font-weight:500}
.contact .cfoot{margin-top:40px;font-size:16px;color:var(--muted);letter-spacing:.04em}
.contact .cfoot b{color:var(--ink-soft);font-weight:500}

/* corporate logo (image1) chip */
.cover .corp{position:absolute;top:42px;right:50px;z-index:3;background:rgba(255,255,255,.95);
  border-radius:13px;padding:13px 20px;box-shadow:0 16px 40px -16px rgba(0,0,0,.75)}
.cover .corp img{height:58px;display:block}
.contact .corp.center{display:inline-block;background:rgba(255,255,255,.95);border-radius:14px;
  padding:14px 24px;margin-bottom:28px;box-shadow:0 16px 40px -16px rgba(0,0,0,.6)}
.contact .corp.center img{height:60px;display:block}

/* ============ HUD ============ */
#hud{position:fixed;inset:0;z-index:30;pointer-events:none}
.brand{position:absolute;top:34px;left:46px;display:flex;align-items:center;gap:11px;
  opacity:.92;transition:opacity .4s}
.brand img{height:34px}
.brand .bw{font-size:16.5px;font-weight:600;letter-spacing:.02em;color:var(--ink)}
.brand .bw b{color:var(--gold)}
#deck[data-type="cover"] .brand,#deck[data-type="chapter"] .brand,#deck[data-type="contact"] .brand{opacity:0}
#deck[data-type="cover"] .chip,#deck[data-type="contact"] .chip{opacity:0}
.chip{position:absolute;top:36px;right:46px;font-size:14.5px;letter-spacing:.22em;text-transform:uppercase;
  color:var(--muted);display:flex;align-items:center;gap:10px}
.chip .dot{width:6px;height:6px;border-radius:50%;background:var(--gold)}
.counter{position:absolute;bottom:34px;right:48px;font-size:15px;color:var(--muted);
  font-variant-numeric:tabular-nums;letter-spacing:.1em}
.counter b{color:var(--gold);font-weight:600;font-size:19px}
.pbar{position:absolute;left:0;bottom:0;height:3px;width:100%;background:rgba(255,255,255,.06)}
.pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold-dk),var(--gold-lt));
  transition:width .5s var(--ease)}
.nav{position:absolute;bottom:30px;left:48px;display:flex;gap:10px;pointer-events:auto}
.nav button{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--panel);
  color:var(--ink);cursor:pointer;display:grid;place-items:center;transition:.25s;backdrop-filter:blur(6px)}
.nav button:hover{background:var(--gold);color:var(--bg);border-color:var(--gold)}
.nav button svg{width:18px;height:18px}
.hint{position:absolute;bottom:36px;left:50%;transform:translateX(-50%);font-size:14px;color:var(--muted);
  letter-spacing:.08em;opacity:.7;transition:opacity .6s}
.hint b{color:var(--ink-soft)}

@media (max-width:760px){.hint{display:none}.brand .bw{display:none}}

/* ============ LEFT NAV / TABLE OF CONTENTS ============ */
:root{--toc-w:272px}
#toc{position:fixed;top:0;left:0;width:var(--toc-w);height:100vh;z-index:35;
  background:#14171b;border-right:1px solid var(--line-soft);display:flex;flex-direction:column;
  transform:translateX(0);transition:transform .35s var(--ease)}
body:not(.toc-open) #toc{transform:translateX(-101%)}
#toc .toc-head{display:flex;align-items:center;gap:11px;padding:20px 18px 15px;border-bottom:1px solid var(--line-soft);flex:0 0 auto}
#toc .toc-head img{height:26px}
#toc .toc-head .tt{font-size:15px;font-weight:600;color:var(--ink);letter-spacing:.01em}
#toc .toc-head .tt b{color:var(--gold)}
#toc .toc-list{list-style:none;margin:0;padding:8px 0 18px;overflow-y:auto;overflow-x:hidden;flex:1 1 auto}
#toc .toc-list::-webkit-scrollbar{width:8px}
#toc .toc-list::-webkit-scrollbar-thumb{background:rgba(200,162,101,.28);border-radius:8px}
#toc .toc-item{display:flex;gap:11px;align-items:baseline;padding:7px 18px;cursor:pointer;
  border-left:3px solid transparent;transition:background .2s,border-color .2s}
#toc .toc-item:hover{background:rgba(255,255,255,.045)}
#toc .toc-item .ti-n{font-size:12px;color:var(--slate);font-variant-numeric:tabular-nums;min-width:22px;flex:0 0 auto}
#toc .toc-item .ti-t{font-size:13.5px;color:var(--ink-soft);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#toc .toc-item.cur{background:rgba(200,162,101,.13);border-left-color:var(--gold)}
#toc .toc-item.cur .ti-n{color:var(--gold)}
#toc .toc-item.cur .ti-t{color:var(--ink);font-weight:600}
#toc .toc-item.type-chapter{margin-top:7px}
#toc .toc-item.type-chapter .ti-n{color:var(--gold)}
#toc .toc-item.type-chapter .ti-t{color:var(--gold-lt);font-weight:700;text-transform:uppercase;font-size:11.5px;letter-spacing:.07em}
/* toggle button */
#toctgl{position:fixed;top:15px;left:15px;z-index:36;width:40px;height:40px;border-radius:10px;
  border:1px solid var(--line-soft);background:rgba(20,23,27,.82);color:var(--ink);cursor:pointer;
  display:grid;place-items:center;backdrop-filter:blur(6px);transition:left .35s var(--ease),background .2s;pointer-events:auto}
body.toc-open #toctgl{left:calc(var(--toc-w) - 52px);background:transparent;border-color:transparent;color:var(--muted)}
#toctgl svg{width:20px;height:20px}

/* ============================================================

(function () {
  "use strict";
  if (window.SplitText) gsap.registerPlugin(SplitText);
  if (window.CustomEase) gsap.registerPlugin(CustomEase);
  if (window.CustomEase) CustomEase.create("lux", "M0,0 C0.16,1 0.3,1 1,1");

  var REDUCE = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var DUR = REDUCE ? 0.001 : 1;

  /* ---------- inline SVG diagrams (on-brand, vector) ---------- */
  var DIAGRAMS = {
    // Multi-layer filtration mechanism: dirty gas → dust cake → media layers → clean gas
    filtration: function(){
      var dots="";
      for(var i=0;i<26;i++){
        var cy=44+((i*53)%430), cx=70+((i*37)%150), r=2+(i%3);
        dots+='<circle class="dg-dust" cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="#c8a265" opacity="'+(0.5+(i%4)*0.12)+'"/>';
      }
      var arrowsIn="", arrowsOut="";
      for(var a=0;a<5;a++){ var y=70+a*92;
        arrowsIn +='<g class="dg-arrow-in" opacity="0.9"><line x1="30" y1="'+y+'" x2="250" y2="'+y+'" stroke="#8e99a4" stroke-width="2"/><path d="M250 '+(y-5)+' L262 '+y+' L250 '+(y+5)+'" fill="#8e99a4"/></g>';
        arrowsOut+='<g class="dg-arrow-out"><line x1="470" y1="'+y+'" x2="612" y2="'+y+'" stroke="#7fb98a" stroke-width="2.4"/><path d="M612 '+(y-5)+' L624 '+y+' L612 '+(y+5)+'" fill="#7fb98a"/></g>';
      }
      return '<svg viewBox="0 0 640 470" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Multi-layer filtration mechanism">'
        + '<defs>'
        +   '<linearGradient id="dgCake" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#c8a265" stop-opacity=".55"/><stop offset="1" stop-color="#c8a265" stop-opacity=".15"/></linearGradient>'
        +   '<linearGradient id="dgClean" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7fb98a" stop-opacity=".05"/><stop offset="1" stop-color="#7fb98a" stop-opacity=".22"/></linearGradient>'
        + '</defs>'
        + '<rect x="0" y="0" width="640" height="470" fill="#14171b"/>'
        // zones
        + '<rect x="0" y="0" width="290" height="470" fill="#1d2228"/>'
        + '<rect x="470" y="0" width="170" height="470" fill="url(#dgClean)"/>'
        + arrowsIn + dots
        // dust cake
        + '<rect class="dg-layer" x="290" y="0" width="40" height="470" fill="url(#dgCake)"/>'
        // filter media multi-layers
        + '<rect class="dg-layer" x="330" y="0" width="46" height="470" fill="#e0e2e5" opacity=".92"/>'
        + '<rect class="dg-layer" x="376" y="0" width="46" height="470" fill="#cdd2d8" opacity=".92"/>'
        + '<rect class="dg-layer" x="422" y="0" width="48" height="470" fill="#aeb6bf" opacity=".92"/>'
        // fiber texture
        + (function(){var f="";for(var k=0;k<60;k++){var x=332+(k*7)%134, y=10+(k*61)%450, len=14+(k%3)*8, rot=(k%2?20:-24);f+='<line x1="'+x+'" y1="'+y+'" x2="'+(x+len*Math.cos(rot*Math.PI/180)).toFixed(1)+'" y2="'+(y+len*Math.sin(rot*Math.PI/180)).toFixed(1)+'" stroke="#8e99a4" stroke-width="1" opacity=".5"/>';}return f;})()
        + arrowsOut
        // labels
        + '<g font-family="Sora,sans-serif" font-weight="600">'
        +   '<text x="20" y="450" fill="#8e99a4" font-size="17">Dirty gas + dust</text>'
        +   '<text x="300" y="28" fill="#c8a265" font-size="15" transform="rotate(90 300 28)">Dust cake</text>'
        +   '<text x="352" y="30" fill="#4a5c6a" font-size="14" transform="rotate(90 352 30)">Filter media layers</text>'
        +   '<text x="498" y="450" fill="#7fb98a" font-size="17">Clean gas</text>'
        + '</g>'
        + '</svg>';
    }
  };

  /* ---------- helpers ---------- */
  function escA(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
  function fmt(v, dec, comma){
    var s = dec>0 ? v.toFixed(dec) : Math.round(v).toString();
    if(comma){ var p=s.split("."); p[0]=p[0].replace(/\B(?=(\d{3})+(?!\d))/g,","); s=p.join("."); }
    return s;
  }

  /* ---------- block renderers (return HTML string) ---------- */
  function bLabel(t){ return '<div class="lead r"><div class="lh">'+t+'</div></div>'; }

  function bLead(a){
    var h=a[0], ps=a[1]||[];
    var html='<div class="lead r">';
    if(h) html+='<div class="lh">'+h+'</div>';
    ps.forEach(function(p){ html+='<p>'+p+'</p>'; });
    return html+'</div>';
  }

  function bStats(items, cls){
    var html='<div class="stats '+(cls||"")+'">';
    items.forEach(function(s){
      var isNum=/^[\d.,]+$/.test(s.n);
      var pre = s.p ? '<span class="pre">'+escA(s.p)+'</span>' : '';
      var unit= s.u ? '<span class="u">'+escA(s.u)+'</span>' : '';
      var num = isNum ? '<span class="cv" data-num="'+s.n+'">'+s.n+'</span>' : '<span class="cv">'+s.n+'</span>';
      html+='<div class="stat r"><div class="v">'+pre+num+unit+'</div><div class="l">'+s.l+'</div></div>';
    });
    return html+'</div>';
  }

  function bCards(items, cls){
    var html='<div class="cards '+(cls||"")+'">';
    items.forEach(function(c){
      var n = (typeof c[0]==="string" && /^\d+\.$/.test("")) ? "" : "";
      html+='<div class="card r"><div class="ch">'+c[0]+'</div><p>'+c[1]+'</p>';
      if(c[2]&&c[2].length){ html+='<div class="tags">'; c[2].forEach(function(t){ html+='<span>'+t+'</span>'; }); html+='</div>'; }
      html+='</div>';
    });
    return html+'</div>';
  }

  function bList(items){
    var html='<ul class="list">';
    items.forEach(function(i){ html+='<li class="r">'+i+'</li>'; });
    return html+'</ul>';
  }

  function bSpecs(items){
    var html='<div class="specs">';
    items.forEach(function(s){ html+='<div class="spec r"><span class="k">'+s[0]+'</span><span class="v">'+s[1]+'</span></div>'; });
    return html+'</div>';
  }

  function bSteps(items){
    var html='<div class="steps"><span class="line"></span>';
    items.forEach(function(s){
      html+='<div class="step r"><div class="n">'+s[0]+'</div><div class="st">'+s[1]+'</div><p>'+s[2]+'</p></div>';
    });
    return html+'</div>';
  }

  function bNote(a){ return '<div class="note r"><div class="nh">'+a[0]+'</div><p>'+a[1]+'</p></div>'; }

  function bBadges(items){
    var html='<div class="badges">';
    items.forEach(function(b){ html+='<span class="badge r">'+b+'</span>'; });
    return html+'</div>';
  }

  function bBars(items){
    var html='<div class="bars">';
    items.forEach(function(b){
      html+='<div class="bar r"><div class="bt"><b>'+b[0]+'</b><span>'+b[1]+'%</span></div>'
          +'<div class="track"><div class="fill" data-pct="'+b[1]+'" style="width:'+b[1]+'%"></div></div></div>';
    });
    return html+'</div>';
  }

  function bFigure(a){ return '<figure class="figure r"><img src="'+a[0]+'" alt=""/>'+(a[1]?'<figcaption>'+a[1]+'</figcaption>':'')+'</figure>'; }
  function bFigGrid(items){
    var html='<div class="figs c2">';
    items.forEach(function(s){ html+='<figure class="figure r" style="aspect-ratio:4/3"><img src="'+s+'" alt=""/></figure>'; });
    return html+'</div>';
  }
  function bFig(o){
    var cls = "figure r" + (o.mode==="contain" ? " contain" : "");
    var ar = o.ar || (o.mode==="contain" ? "4/3" : "16/10");
    return '<figure class="'+cls+'" style="aspect-ratio:'+ar+'"><img src="'+o.src+'" alt=""/>'
         + (o.cap?'<figcaption>'+o.cap+'</figcaption>':'') + '</figure>';
  }
  function bFigs(o){
    var ar=o.ar||"3/2", fc="figure r"+(o.mode==="contain"?" contain":""), caps=o.caps||[];
    var html='<div class="figs c'+(o.cols||2)+'">';
    o.srcs.forEach(function(s,i){ html+='<figure class="'+fc+'" style="aspect-ratio:'+ar+'"><img src="'+s+'" alt=""/>'+(caps[i]?'<figcaption>'+caps[i]+'</figcaption>':'')+'</figure>'; });
    return html+'</div>';
  }
  function bSplit(o){
    var ratio=o.ratio||"r5050";
    return '<div class="cols '+ratio+'" style="gap:'+(o.gap||"38px")+'">'
      + '<div class="col">'+o.cols[0].map(renderBlock).join("")+'</div>'
      + '<div class="col">'+o.cols[1].map(renderBlock).join("")+'</div></div>';
  }
  function bDiagram(kind, cap){
    var svg = DIAGRAMS[kind] ? DIAGRAMS[kind]() : "";
    return '<figure class="figure diagram r" style="aspect-ratio:'+(kind==="filtration"?"16/11":"16/10")+'">'
         + svg + (cap?'<figcaption>'+cap+'</figcaption>':'') + '</figure>';
  }
  function bBeforeAfter(o){
    return '<div class="bafter">'
      + '<figure class="figure r" style="aspect-ratio:4/3"><img src="'+o.before+'" alt=""/>'
      +   '<span class="batag old">'+(o.bl||"Before")+'</span></figure>'
      + '<div class="baarrow r"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 12h14M13 6l6 6-6 6"/></svg></div>'
      + '<figure class="figure r" style="aspect-ratio:4/3"><img src="'+o.after+'" alt=""/>'
      +   '<span class="batag new">'+(o.al||"After")+'</span></figure>'
      + '</div>';
  }

  function renderBlock(b){
    if(b.lead)        return bLead(b.lead);
    if(b.label)       return bLabel(b.label);
    if(b.cardsTitle)  return bLabel(b.cardsTitle);
    if(b.listTitle)   return bLabel(b.listTitle);
    if(b.specsTitle)  return bLabel(b.specsTitle);
    if(b.badgesTitle) return bLabel(b.badgesTitle);
    if(b.stats)       return bStats(b.stats, b.cls);
    if(b.cards)       return bCards(b.cards, b.cls);
    if(b.list)        return bList(b.list);
    if(b.specs)       return bSpecs(b.specs);
    if(b.steps)       return bSteps(b.steps);
    if(b.note)        return bNote(b.note);
    if(b.badges)      return bBadges(b.badges);
    if(b.bars)        return bBars(b.bars);
    if(b.figure)      return bFigure(b.figure);
    if(b.figGrid)     return bFigGrid(b.figGrid);
    if(b.fig)         return bFig(b.fig);
    if(b.figs)        return bFigs(b.figs);
    if(b.split)       return bSplit(b);
    if(b.diagram)     return bDiagram(b.diagram, b.cap);
    if(b.beforeAfter) return bBeforeAfter(b.beforeAfter);
    return "";
  }

  function head(s){
    return '<div class="s-head"><div class="kicker r">'+s.kicker+'</div>'
         + '<h2 class="s-title r">'+s.title+'</h2><div class="s-rule r"></div></div>';
  }

  /* ---------- slide renderers ---------- */
  function renderSlide(s){
    switch(s.type){
      case "cover": return renderCover(s);
      case "toc": return renderTOC(s);
      case "chapter": return renderChapter(s);
      case "content": return renderContent(s);
      case "map": return renderMap(s);
      case "partners": return renderPartners(s);
      case "contact": return renderContact(s);
    }
    return "";
  }

  function renderCover(s){
    return '<div class="cbg"><img src="'+s.bg+'" alt=""/></div>'
      + (s.corp?'<div class="corp"><img src="'+s.corp+'" alt="De-AirTech 艾霆环保"/></div>':'')
      + '<div class="inner">'
      +   '<div class="brandline"><img src="assets/img/image2.png" alt=""/><span class="bw">De‑<b>AirTech</b></span></div>'
      +   '<div class="ckick">'+s.kicker+'</div>'
      +   '<h1><span class="l1 split">'+s.l1+'</span><span class="l2 split">'+s.l2+'</span></h1>'
      +   '<div class="csub">'+s.sub+'</div>'
      +   '<div class="ctag">'+s.tag+'</div>'
      + '</div>';
  }

  function renderTOC(s){
    var html=head(s)+'<div class="body"><div class="tgrid">';
    s.items.forEach(function(it,i){
      html+='<div class="titem r" data-go="'+i+'"><div class="tn">'+it[0]+'</div>'
          +'<div class="tt"><b>'+it[1]+'</b><span>'+it[2]+'</span></div></div>';
    });
    return html+'</div></div>';
  }

  function renderChapter(s){
    return '<div class="cbg"><img src="'+s.bg+'" alt=""/></div>'
      + '<div class="inner"><div class="bignum">'+s.n+'</div>'
      + '<div class="ctext"><div class="ck r">'+s.kicker+'</div>'
      + '<h2 class="split">'+s.title+'</h2>'
      + '<div class="cs r">'+s.sub+'</div><div class="crule r"></div></div></div>';
  }

  function renderContent(s){
    var html=head(s)+'<div class="body">';
    if(s.layout==="rows"){
      html+='<div class="rows">';
      s.rows.forEach(function(b){ html+=renderBlock(b); });
      html+='</div>';
    } else {
      html+='<div class="cols '+s.layout+'"><div class="col">';
      s.main.forEach(function(b){ html+=renderBlock(b); });
      html+='</div><div class="col">';
      s.side.forEach(function(b){ html+=renderBlock(b); });
      html+='</div></div>';
    }
    return html+'</div>';
  }

  function renderMap(s){
    var html=head(s)+'<div class="body"><div class="mwrap"><div class="frame r">'
        +'<img src="'+s.img+'" alt="De-AirTech global project map"/>';
    s.markers.forEach(function(m){ html+='<span class="marker" style="left:'+m[0]+'%;top:'+m[1]+'%"></span>'; });
    html+='</div><div class="mside">'+bStats(s.stats,"c1");
    html+='<div class="badges">';
    s.legend.forEach(function(l){ html+='<span class="badge r"><span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:'+l[1]+';margin-right:8px"></span>'+l[0]+'</span>'; });
    html+='</div></div></div></div>';
    return html;
  }

  function renderPartners(s){
    var html=head(s)+'<div class="body"><div class="cols r5545"><div class="col">'
        + bLead(s.lead)
        + '<div class="pgrid">';
    s.logos.forEach(function(l){ html+='<div class="plogo r"><img src="assets/img/'+l+'" alt=""/></div>'; });
    html+='</div></div><div class="col">'
        + bLabel("Partnership Benefits")
        + bList(s.benefits)
        + bStats([s.stat],"c1")
        + '</div></div></div>';
    return html;
  }

  function renderContact(s){
    var html='<div class="cbg"><img src="'+s.bg+'" alt=""/></div><div class="inner">'
        + (s.corp?'<div class="corp center r"><img src="'+s.corp+'" alt="De-AirTech 艾霆环保"/></div>':'')
        + '<div class="ck r">'+s.kicker+'</div><h2 class="split">'+s.title+'</h2>'
        + '<div class="cmsg r">'+s.msg+'</div><div class="cinfo">';
    s.info.forEach(function(c){ html+='<div class="ci r"><div class="cl">'+c[0]+'</div><div class="cv">'+c[1]+'</div></div>'; });
    html+='</div><div class="cfoot r"><b>'+s.foot+'</b></div></div>';
    return html;
  }

  /* ---------- mount ---------- */
  var stage=document.getElementById("stage");
  var els=[];
  SLIDES.forEach(function(s){
    var sec=document.createElement("section");
    sec.className="slide "+s.type;
    sec.dataset.type=s.type;
    sec.innerHTML=renderSlide(s);
    stage.appendChild(sec);
    els.push(sec);
  });
  document.getElementById("ctot").textContent=String(SLIDES.length).padStart(2,"0");
  document.getElementById("brandlogo").src="assets/img/image2.png";
  var tl=document.getElementById("toclogo"); if(tl) tl.src="assets/img/image2.png";

  var chapters=[]; SLIDES.forEach(function(s,i){ if(s.type==="chapter") chapters.push(i); });

  /* ---------- build left table-of-contents ---------- */
  function navLabel(s){
    if(s.type==="cover") return "Cover";
    if(s.type==="toc") return "Contents";
    if(s.type==="chapter") return s.n+" · "+s.title;
    if(s.type==="contact") return "Thank You";
    if(s.type==="map") return s.title;
    if(s.type==="partners") return s.title;
    return s.title;
  }
  var tocListEl=document.getElementById("toc-list");
  if(tocListEl){
    SLIDES.forEach(function(s,i){
      var li=document.createElement("li");
      li.className="toc-item type-"+s.type; li.dataset.i=i;
      li.innerHTML='<span class="ti-n">'+String(i+1).padStart(2,"0")+'</span><span class="ti-t">'+navLabel(s)+'</span>';
      li.addEventListener("click", function(){ go(i); });
      tocListEl.appendChild(li);
    });
  }

  /* ---------- scale to fit (any aspect ratio; offset for open TOC) ---------- */
  function tocVisible(){ return document.body.classList.contains("toc-open"); }
  function fit(){
    var W = tocVisible() ? (parseInt(getComputedStyle(document.documentElement).getPropertyValue("--toc-w"))||272) : 0;
    var availW = Math.max(320, window.innerWidth - W);
    var s = Math.min(availW/1920, window.innerHeight/1080);
    stage.style.setProperty("--s", s);
    stage.style.left = (W + availW/2) + "px";
  }
  window.addEventListener("resize", fit);
  // default: show TOC (windowed). fit() runs after this.
  document.body.classList.add("toc-open");
  fit();

  /* ---------- ambient particles ---------- */
  (function(){
    var cv=document.getElementById("fx"), ctx=cv.getContext("2d"), W,H,ps=[];
    function rs(){ W=cv.width=window.innerWidth; H=cv.height=window.innerHeight; }
    window.addEventListener("resize", rs); rs();
    var N = REDUCE ? 0 : Math.min(46, Math.round(W*H/46000));
    for(var i=0;i<N;i++) ps.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.8+0.4,
      s:Math.random()*0.25+0.05,d:Math.random()*Math.PI*2,a:Math.random()*0.35+0.08});
    function loop(){
      ctx.clearRect(0,0,W,H);
      for(var i=0;i<ps.length;i++){ var p=ps[i];
        p.y-=p.s; p.x+=Math.sin(p.d+=0.01)*0.18;
        if(p.y<-6){ p.y=H+6; p.x=Math.random()*W; }
        ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,6.283);
        ctx.fillStyle="rgba(200,162,101,"+p.a+")"; ctx.fill();
      }
      requestAnimationFrame(loop);
    }
    if(!REDUCE) loop();
  })();

  /* ---------- entrance animations ---------- */
  function countUp(slide, tl, pos){
    slide.querySelectorAll(".stat .v .cv[data-num]").forEach(function(cv){
      var raw=cv.dataset.num; if(!/^[\d.,]+$/.test(raw)) return;
      var target=parseFloat(raw.replace(/,/g,"")); if(isNaN(target)) return;
      var dec=(raw.split(".")[1]||"").length, comma=/,/.test(raw), o={v:0};
      cv.textContent=fmt(0,dec,comma);
      tl.to(o,{v:target,duration:1.1*DUR,ease:"power2.out",
        onUpdate:function(){ cv.textContent=fmt(o.v,dec,comma); }}, pos);
    });
  }

  function splitReveal(tl, el, pos){
    if(!el) return;
    if(!window.SplitText){ tl.from(el,{autoAlpha:0,y:30,duration:0.7*DUR},pos); return; }
    try{
      if(el._st && el._st.revert) el._st.revert();   // clean prior split on revisit
      var sp=new SplitText(el,{type:"chars,words"});
      el._st=sp;
      tl.from(sp.chars,{yPercent:120,autoAlpha:0,rotateX:-40,duration:0.7*DUR,ease:"power3.out",
        stagger:0.024},pos);
    }catch(e){ tl.from(el,{autoAlpha:0,y:30,duration:0.7*DUR},pos); }
  }

  function reveal(tl, nodes, pos, fromVars){
    if(!nodes.length) return;
    tl.fromTo(nodes, Object.assign({autoAlpha:0,y:26}, fromVars||{}),
      {autoAlpha:1,y:0,x:0,scale:1,duration:0.6*DUR,ease:"power3.out",
       stagger:{each:0.05, from:"start"}}, pos);
  }

  function enter(slide, dir){
    var type=slide.dataset.type;
    var tl=gsap.timeline({defaults:{ease:"power3.out"}});
    gsap.set(slide,{autoAlpha:1});

    if(type==="cover"){
      tl.fromTo(slide.querySelector(".cbg img"),{scale:1.14,xPercent:2},
        {scale:1,xPercent:0,duration:2.6*DUR,ease:"power2.out"},0);
      tl.from(slide.querySelector(".brandline"),{autoAlpha:0,y:24,duration:0.7*DUR},0.2);
      tl.from(slide.querySelector(".ckick"),{autoAlpha:0,y:20,duration:0.6*DUR},0.35);
      slide.querySelectorAll(".split").forEach(function(el,i){ splitReveal(tl,el,0.5+i*0.18); });
      tl.from(slide.querySelector(".csub"),{autoAlpha:0,y:24,duration:0.7*DUR},0.95);
      tl.from(slide.querySelector(".ctag"),{autoAlpha:0,x:-20,duration:0.7*DUR},1.1);
      return tl;
    }
    if(type==="chapter"){
      tl.fromTo(slide.querySelector(".cbg img"),{scale:1.16,xPercent:(dir<0?-3:3)},
        {scale:1,xPercent:0,duration:2.2*DUR,ease:"power2.out"},0);
      tl.fromTo(slide.querySelector(".bignum"),{autoAlpha:0,scale:0.82,xPercent:-6},
        {autoAlpha:1,scale:1,xPercent:0,duration:1.2*DUR,ease:"lux"},0.15);
      tl.from(slide.querySelector(".ck"),{autoAlpha:0,y:20,duration:0.6*DUR},0.4);
      splitReveal(tl, slide.querySelector(".split"),0.55);
      tl.from(slide.querySelector(".cs"),{autoAlpha:0,y:22,duration:0.7*DUR},0.9);
      tl.fromTo(slide.querySelector(".crule"),{scaleX:0,transformOrigin:"left"},
        {scaleX:1,duration:0.7*DUR},1.0);
      return tl;
    }
    if(type==="contact"){
      tl.fromTo(slide.querySelector(".cbg img"),{scale:1.12},{scale:1,duration:2.4*DUR,ease:"power2.out"},0);
      tl.from(slide.querySelector(".ck"),{autoAlpha:0,y:18,duration:0.6*DUR},0.2);
      splitReveal(tl, slide.querySelector(".split"),0.35);
      tl.from(slide.querySelector(".cmsg"),{autoAlpha:0,y:22,duration:0.7*DUR},0.8);
      reveal(tl, slide.querySelectorAll(".ci"),0.95);
      tl.from(slide.querySelector(".cfoot"),{autoAlpha:0,duration:0.7*DUR},1.2);
      return tl;
    }

    /* generic content / toc / map / partners */
    tl.fromTo(slide,{xPercent:dir<0?-4:4},{xPercent:0,duration:0.6*DUR,ease:"power2.out"},0);
    // header
    var k=slide.querySelector(".kicker.r"), t=slide.querySelector(".s-title.r"), ru=slide.querySelector(".s-rule.r");
    if(k) tl.from(k,{autoAlpha:0,x:-22,duration:0.6*DUR},0.05);
    if(t) tl.from(t,{autoAlpha:0,y:26,duration:0.7*DUR},0.14);
    if(ru) tl.fromTo(ru,{scaleX:0,transformOrigin:"left"},{scaleX:1,autoAlpha:1,duration:0.6*DUR},0.28);

    // body items (exclude header .r already handled)
    var items=[].slice.call(slide.querySelectorAll(".body .r, .inner .r"));
    reveal(tl, items, 0.34);

    // steps connector
    var line=slide.querySelector(".steps .line");
    if(line) tl.fromTo(line,{scaleX:0},{scaleX:1,duration:0.9*DUR,ease:"power2.inOut"},0.5);

    // bars
    slide.querySelectorAll(".bar .fill").forEach(function(f,i){
      tl.fromTo(f,{scaleX:0,transformOrigin:"left"},{scaleX:1,duration:0.9*DUR,ease:"power3.out"},0.6+i*0.08);
    });

    // count-ups
    countUp(slide, tl, 0.6);

    // map markers pulse
    var mk=slide.querySelectorAll(".marker");
    if(mk.length){
      tl.fromTo(mk,{scale:0,autoAlpha:0},{scale:1,autoAlpha:1,duration:0.5*DUR,stagger:0.08,ease:"back.out(2)"},0.7);
      if(!REDUCE) mk.forEach(function(m){
        gsap.to(m,{boxShadow:"0 0 0 14px rgba(200,162,101,0)",repeat:-1,duration:1.8,ease:"power2.out"});
      });
    }
    return tl;
  }

  /* ---------- controller ---------- */
  var idx=0, busy=false, started=false, curTL=null, deck=document.getElementById("deck");
  function clamp(n){ return Math.max(0, Math.min(els.length-1, n)); }

  function updateHUD(){
    var s=SLIDES[idx];
    deck.dataset.type=s.type;
    document.getElementById("cnum").textContent=String(idx+1).padStart(2,"0");
    document.getElementById("chiptag").textContent=s.chip||"De‑AirTech";
    document.getElementById("pbar").style.width=(idx/(els.length-1)*100)+"%";
    if(tocListEl){
      var items=tocListEl.children;
      for(var k=0;k<items.length;k++) items[k].classList.toggle("cur", k===idx);
      if(items[idx]) items[idx].scrollIntoView({block:"nearest"});
    }
  }

  function go(n){
    if(!started) return;
    n=clamp(n); if(n===idx||busy) return;
    for(var k=0;k<els.length;k++){ if(k!==idx && els[k].classList.contains("active")){ els[k].classList.remove("active"); gsap.set(els[k],{clearProps:"all"}); } }
    var dir=n>idx?1:-1, prev=els[idx], next=els[n]; idx=n; busy=true; updateHUD();
    if(curTL) curTL.kill();
    gsap.killTweensOf(prev);
    gsap.to(prev,{autoAlpha:0,xPercent:-5*dir,duration:0.4*DUR,ease:"power2.in",
      onComplete:function(){ prev.classList.remove("active"); gsap.set(prev,{xPercent:0,clearProps:"visibility"}); }});
    next.classList.add("active");
    gsap.set(next,{autoAlpha:1,xPercent:0});
    curTL=enter(next,dir);
    curTL.eventCallback("onComplete",function(){ busy=false; });
    gsap.delayedCall(0.85,function(){ busy=false; });
  }
  function next(){ go(idx+1); }
  function prev(){ go(idx-1); }

  /* show starts immediately; F toggles fullscreen */
  started=true;
  function showInstant(n){
    n=clamp(n);
    for(var k=0;k<els.length;k++){ if(k!==n) els[k].classList.remove("active"); }
    idx=n; els[n].classList.add("active"); gsap.set(els[n],{autoAlpha:1,xPercent:0});
    updateHUD(); if(curTL) curTL.kill(); curTL=enter(els[n],1);
  }
  function requestFS(){
    var el=document.documentElement, rq=el.requestFullscreen||el.webkitRequestFullscreen||el.msRequestFullscreen;
    if(!rq) return;
    try{ var p=rq.call(el); if(p&&p.catch) p.catch(function(){}); }catch(e){}
  }

  /* ---------- TOC sidebar: manual toggle + auto-hide in fullscreen ---------- */
  var tocPref=true;  // user preference (shown when windowed)
  function isFs(){ return !!(document.fullscreenElement||document.webkitFullscreenElement||document.msFullscreenElement); }
  function applyToc(){
    var fs=isFs();
    document.body.classList.toggle("is-fs", fs);
    document.body.classList.toggle("toc-open", tocPref && !fs);
    fit();
  }
  var tocTgl=document.getElementById("toctgl");
  if(tocTgl) tocTgl.addEventListener("click", function(e){ e.stopPropagation(); tocPref=!tocPref; applyToc(); });
  document.addEventListener("fullscreenchange", applyToc);
  document.addEventListener("webkitfullscreenchange", applyToc);

  /* ---------- input ---------- */
  document.getElementById("next").addEventListener("click",function(e){ e.stopPropagation(); next(); });
  document.getElementById("prev").addEventListener("click",function(e){ e.stopPropagation(); prev(); });

  window.addEventListener("keydown",function(e){
    switch(e.key){
      case "ArrowRight": case "PageDown": case " ": case "Spacebar": e.preventDefault(); next(); break;
      case "ArrowDown": e.preventDefault(); next(); break;
      case "ArrowLeft": case "PageUp": e.preventDefault(); prev(); break;
      case "ArrowUp": e.preventDefault(); prev(); break;
      case "Home": e.preventDefault(); go(0); break;
      case "End": e.preventDefault(); go(els.length-1); break;
      case "f": case "F":
        if(!document.fullscreenElement) requestFS();
        else if(document.exitFullscreen) try{ document.exitFullscreen(); }catch(err){}
        break;
    }
  });

  // click left/right to navigate (ignore HUD buttons & TOC items)
  deck.addEventListener("click",function(e){
    if(e.target.closest(".nav")||e.target.closest(".titem")||e.target.closest("#toc")||e.target.closest("#toctgl")) return;
    var W = tocVisible() ? (parseInt(getComputedStyle(document.documentElement).getPropertyValue("--toc-w"))||272) : 0;
    var x=(e.clientX - W)/Math.max(1,(window.innerWidth - W));
    if(x>0.5) next(); else prev();
  });

  // TOC jump
  deck.addEventListener("click",function(e){
    var it=e.target.closest(".titem"); if(!it) return;
    e.stopPropagation(); var c=+it.dataset.go;
    if(chapters[c]!=null) go(chapters[c]);
  });

  // touch swipe
  var tx=0,ty=0;
  deck.addEventListener("touchstart",function(e){ tx=e.touches[0].clientX; ty=e.touches[0].clientY; },{passive:true});
  deck.addEventListener("touchend",function(e){
    var dx=e.changedTouches[0].clientX-tx, dy=e.changedTouches[0].clientY-ty;
    if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)){ dx<0?next():prev(); }
  },{passive:true});

  // fade the hint after a few seconds
  gsap.to(".hint",{autoAlpha:0,duration:1,delay:6});

  // deep-linking: #12 jumps to slide 12 (1-based); also expose for tooling
  function fromHash(){
    var n=parseInt((location.hash||"").replace("#",""),10); if(!isNaN(n)) go(n-1);
  }
  window.addEventListener("hashchange", fromHash);
  // initial render — respect a deep-link hash (#12), else the cover
  (function(){ var n=parseInt((location.hash||"").replace("#",""),10); showInstant(isNaN(n)?0:n-1); })();
  window.__deck={ go:go, next:next, prev:prev, get index(){return idx;} };
})();

</script>
</body>
</html>
